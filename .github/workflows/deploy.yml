name: Deploy to Azure VM

on:
  push:
    branches:
      - main  # Tự động deploy khi push lên nhánh main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Executing remote ssh commands using ssh key
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 40.82.145.30
          username: azureuser
          key: ${{ secrets.AZURE_SSH_KEY }}
          script: |
            # 1. Khai báo môi trường để nhận pnpm và pm2 trong non-interactive shell
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PNPM_HOME="$HOME/.local/share/pnpm"
            export PATH="$PNPM_HOME:$HOME/.npm-global/bin:$PATH"

            cd ~/TicketBox
            
            # 2. Xóa các thay đổi tạm thời trên server để tránh xung đột khi git pull
            git reset --hard HEAD
            git clean -fd
            git pull origin main  
            
            # 3. Cài đặt các thư viện mới nếu có thay đổi
            pnpm install
            
            # 4. Sinh lại Prisma Client và chạy migration
            pnpm --filter @repo/be run migrate:gen
            pnpm --filter @repo/be run migrate:deploy
            
            # 5. Biên dịch lại mã nguồn Backend & Frontend
            pnpm build
            
            # 6. Khởi động lại các tiến trình chạy ngầm qua PM2
            pm2 restart all
